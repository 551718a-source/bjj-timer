<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BJJ Drill Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#000000">
    
    <style>
        :root { --bg: #000000; --card: #161616; --accent: #3498db; --green: #2ecc71; --red: #e74c3c; --yellow: #f1c40f; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        
        .dashboard { text-align: center; margin-bottom: 20px; margin-top: 5px; }

        .timer-card { 
            background: var(--card); padding: 35px 15px; border-radius: 24px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 1px solid #333; transition: border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mode-work { border-color: var(--green); box-shadow: 0 0 15px rgba(46, 204, 113, 0.2); }
        .mode-rest { border-color: var(--red); box-shadow: 0 0 15px rgba(231, 76, 60, 0.2); }

        #status-badge { 
            display: inline-block; padding: 4px 16px; border-radius: 20px; 
            font-size: 13px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px;
        }
        .mode-work #status-badge { background: var(--green); color: black; }
        .mode-rest #status-badge { background: var(--red); color: white; }

        #drill-display { font-size: 46px; font-weight: 900; margin: 15px 0; min-height: 1.2em; line-height: 1.1; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #timer { font-size: 100px; font-weight: 200; margin: 0; font-variant-numeric: tabular-nums; letter-spacing: -4px; line-height: 1; }

        .settings-row { display: flex; justify-content: center; gap: 12px; margin: 25px 0 15px 0; }
        .input-group { display: flex; flex-direction: column; align-items: center; background: #222; padding: 12px; border-radius: 16px; flex: 1; border: 1px solid #333; }
        .input-group label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .time-select-wrap { display: flex; align-items: center; gap: 4px; color: #666; font-size: 14px; }
        
        select {
            background: #333; color: white; border: 1px solid #444; padding: 8px 6px; border-radius: 8px;
            font-size: 20px; font-weight: bold; appearance: none; -webkit-appearance: none;
            min-width: 55px; text-align: center;
        }

        button { border: none; color: white; padding: 18px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 18px; transition: all 0.1s; touch-action: manipulation; }
        button:active { transform: scale(0.96); opacity: 0.9; }
        .btn-large { width: 100%; font-size: 26px; margin-bottom: 12px; box-shadow: 0 4px 0 rgba(0,0,0,0.4); }
        .btn-start { background: var(--accent); }
        .btn-start.pause { background: #e67e22; }

        .sub-controls { display: flex; gap: 10px; }
        .btn-sub { flex: 1; padding: 14px; font-size: 15px; color: #ccc; background: #2a2a2a; border: 1px solid #444; }
        .btn-finish { color: var(--red); border-color: #400; }
        
        .section { background: var(--card); padding: 18px; border-radius: 20px; margin-top: 20px; border: 1px solid #222; }
        h3 { margin: 0 0 12px 0; font-size: 15px; color: var(--accent); letter-spacing: 1px; }
        input[type="text"] { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 14px; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        
        ul { list-style: none; padding: 0; margin-top: 15px; }
        li { background: #000; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid #222; }
        .edit-input { background: transparent; border: none; color: #fff; font-size: 17px; flex-grow: 1; }
        .del-btn { background: #222; color: #666; padding: 8px 12px; font-size: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="timer-card mode-work" id="timer-card">
            <span id="status-badge">WORK</span>
            <div id="drill-display">Tap Start</div>
            <div id="timer">00:00</div>

            <div class="settings-row">
                <div class="input-group">
                    <label>Work</label>
                    <div class="time-select-wrap">
                        <select id="work-min" onchange="saveSettings()"></select>
                        <select id="work-sec" onchange="saveSettings()"></select>
                    </div>
                </div>
                <div class="input-group">
                    <label>Rest</label>
                    <div class="time-select-wrap">
                        <select id="rest-min" onchange="saveSettings()"></select>
                        <select id="rest-sec" onchange="saveSettings()"></select>
                    </div>
                </div>
            </div>

            <button class="btn-large btn-start" id="btn-start" onclick="toggleTimer()">START</button>
            <div class="sub-controls">
                <button class="btn-sub" onclick="restartRound()">🔄 RESTART</button>
                <button class="btn-sub btn-finish" onclick="finishRound()">⏭️ SKIP (0s)</button>
            </div>
        </div>
    </div>

    <div class="section">
        <h3>Techniques</h3>
        <div style="display:flex; gap:8px;">
            <input type="text" id="new-drill" placeholder="Add Technique...">
            <button onclick="addDrill()" style="background:var(--green); width:65px; color:#000; font-size:24px;">+</button>
        </div>
        <ul id="drill-list"></ul>
    </div>

    <script>
        // --- 画面スリープ防止 ---
        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        function setupSelects() {
            const wMin = document.getElementById('work-min'), wSec = document.getElementById('work-sec'),
                  rMin = document.getElementById('rest-min'), rSec = document.getElementById('rest-sec');
            for (let i = 0; i <= 10; i++) { wMin.options.add(new Option(i+'m', i)); rMin.options.add(new Option(i+'m', i)); }
            for (let i = 0; i <= 50; i += 10) { wSec.options.add(new Option(i+'s', i)); rSec.options.add(new Option(i+'s', i)); }
        }
        setupSelects();

        let myDrills = JSON.parse(localStorage.getItem('myDrills')) || ["Shrimp", "Triangle", "Guard Pass"];
        let workTotalSec = parseInt(localStorage.getItem('workTotalSec')) || 30;
        let restTotalSec = parseInt(localStorage.getItem('restTotalSec')) || 10;
        let timeLeft = workTotalSec, timerId = null, isRunning = false, isResting = false;

        reflectSettingsToSelects();
        updateTimerDisplay(timeLeft);
        updateDrillList();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playGong() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]); // 振動
            const now = audioCtx.currentTime;
            [500, 720, 940].forEach((f, i) => {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = i === 0 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 0.98, now + 2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(now + 2.5);
            });
        }

        function saveSettings() {
            workTotalSec = (parseInt(document.getElementById('work-min').value)*60) + parseInt(document.getElementById('work-sec').value);
            restTotalSec = (parseInt(document.getElementById('rest-min').value)*60) + parseInt(document.getElementById('rest-sec').value);
            if(workTotalSec < 1) workTotalSec = 1;
            localStorage.setItem('workTotalSec', workTotalSec);
            localStorage.setItem('restTotalSec', restTotalSec);
            if (!isRunning) { timeLeft = isResting ? restTotalSec : workTotalSec; updateTimerDisplay(timeLeft); }
        }

        function reflectSettingsToSelects() {
            document.getElementById('work-min').value = Math.floor(workTotalSec / 60);
            document.getElementById('work-sec').value = (Math.floor((workTotalSec % 60) / 10) * 10);
            document.getElementById('rest-min').value = Math.floor(restTotalSec / 60);
            document.getElementById('rest-sec').value = (Math.floor((restTotalSec % 60) / 10) * 10);
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-start');
            if (isRunning) {
                clearInterval(timerId);
                btn.innerText = "RESUME"; btn.classList.remove("pause");
                if (wakeLock) wakeLock.release();
            } else {
                requestWakeLock();
                if(timeLeft === (isResting ? restTotalSec : workTotalSec)) playGong();
                timerId = setInterval(tick, 1000);
                btn.innerText = "PAUSE"; btn.classList.add("pause");
            }
            isRunning = !isRunning;
        }

        function tick() {
            if (timeLeft > 0) { timeLeft--; updateTimerDisplay(timeLeft); } 
            else { switchMode(); }
        }

        function switchMode() {
            playGong();
            if (isResting) { isResting = false; timeLeft = workTotalSec; nextDrill(); setModeDisplay('work'); } 
            else { isResting = true; timeLeft = restTotalSec; setModeDisplay('rest'); 
                   if(restTotalSec > 0) speak("Rest"); else { switchMode(); return; }
            }
        }

        function setModeDisplay(mode) {
            const card = document.getElementById('timer-card'), badge = document.getElementById('status-badge');
            card.className = "timer-card " + (mode === 'work' ? "mode-work" : "mode-rest");
            badge.innerText = mode.toUpperCase();
            if(mode === 'rest') document.getElementById('drill-display').innerText = "REST";
            updateTimerDisplay(timeLeft);
        }

        function restartRound() { timeLeft = isResting ? restTotalSec : workTotalSec; updateTimerDisplay(timeLeft); }
        function finishRound() { timeLeft = 0; updateTimerDisplay(0); setTimeout(switchMode, 100); }

        function nextDrill() {
            if (myDrills.length === 0) return;
            const drill = myDrills[Math.floor(Math.random() * myDrills.length)];
            document.getElementById('drill-display').innerText = drill;
            if (!isResting) speak(drill);
        }

        function updateTimerDisplay(s) {
            const m = Math.floor(s / 60), sec = s % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function addDrill() {
            const input = document.getElementById('new-drill');
            if (!input.value) return;
            myDrills.push(input.value); input.value = ""; saveDrills(); updateDrillList();
        }
        function editDrill(i, v) { myDrills[i] = v; saveDrills(); }
        function deleteDrill(i) { if(confirm('Delete?')) { myDrills.splice(i, 1); saveDrills(); updateDrillList(); } }
        function saveDrills() { localStorage.setItem('myDrills', JSON.stringify(myDrills)); }
        function updateDrillList() {
            const list = document.getElementById('drill-list'); list.innerHTML = "";
            myDrills.forEach((d, i) => {
                list.innerHTML += `<li><input class="edit-input" value="${d}" onchange="editDrill(${i}, this.value)"><button class="del-btn" onclick="deleteDrill(${i})">×</button></li>`;
            });
        }
        function speak(t) { const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; window.speechSynthesis.speak(u); }
    </script>
</body>
</html>
